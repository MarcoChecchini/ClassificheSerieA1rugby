:root[data-theme="dark"]{--bg:#161615;--card:#201f1d;--tx:#eeede8;--mu:#a1a09a;--bd:#33322f;--ac:#5dcaa5;--acbg:#10372d;--up:#56d364;--dn:#ff7b72;--hl:#3a3418}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button:disabled{opacity:.4;cursor:default}
.nav{display:flex;align-items:center;gap:10px}
.nav input[type=range]{flex:1;accent-color:var(--ac)}
.gl{font-weight:600;min-width:110px;text-align:center}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{color:var(--mu);font-weight:500;font-size:12px}
td.t,th.t{text-align:left;white-space:normal}
td.pt{font-weight:700;color:var(--ac)}
tr.sel td{background:var(--hl)}tr.hov td{background:var(--acbg)}tbody tr{cursor:pointer}
.up{color:var(--up)}.dn{color:var(--dn)}.eq{color:var(--mu)}
.res{display:grid;grid-template-columns:1fr auto 1fr;gap:4px 10px;font-size:13.5px}
.res .s{font-weight:700;text-align:center}.res .a{text-align:right}
h2{font-size:15px;margin:0 0 8px}
textarea{width:100%;min-height:110px;font:12.5px/1.4 ui-monospace,Menlo,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
.msg{font-size:13px;margin-top:6px;color:var(--mu)}.err{color:var(--dn)}
details summary{cursor:pointer;font-weight:600}
.bd{vertical-align:middle;margin-right:6px;width:20px;height:23px;object-fit:contain}
img.bd{background:#fff;border-radius:4px;padding:1px}
svg text{fill:var(--mu);font-size:11px}
</style>

const SW=/^(RUGBY|UNIONE|CLUB|ASD|DI|RFC|UNION)$/i;
function bdg(n){
 if(CRESTS[n])return `<img class="bd" src="${CRESTS[n]}" alt="">`;
 const w=n.replace(/[’']/g,"").split(/[\s&.]+/).filter(x=>x&&!SW.test(x));
 const ini=(w.length>1?w[0][0]+w[1][0]:(w[0]||n).slice(0,2)).toUpperCase();
 let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))%360;
 return `<svg class="bd" viewBox="0 0 24 28"><path d="M2 2h20v13c0 6-5 10-10 12C7 25 2 21 2 15z" style="fill:hsl(${h} 45% 38%)"/><text x="12" y="16" text-anchor="middle" style="fill:#fff;font-size:9px;font-weight:700">${ini}</text></svg>`}
const COL={"Unione Rugby Firenze": ["#6d28a8", "#b78af0"], "Junior Badia": ["#1565c0", "#4aa3f0"], "Bologna Rugby": ["#0b3a8c", "#6b9cf0"], "Rugby Casale": ["#1f8a3b", "#4ade80"], "Rugby Feltre": ["#7f1d1d", "#f87171"], "Patavium Rugby Union": ["#c62828", "#ff8a8a"], "Rugby Paese": ["#1e3a6e", "#7da0e0"], "Romagna RFC": ["#a61e1e", "#f0b429"], "Rugby San Donà": ["#2b7fd0", "#60b0f5"], "Ruggers Tarvisium": ["#4b5563", "#d1d5db"], "Valpolicella Rugby": ["#d97706", "#fbbf24"], "Omar Villorba": ["#c9a400", "#ffd60a"], "Rugby Perugia": ["#a31621", "#f08a93"], "Lions Alto Lazio": ["#d4a017", "#f2c94c"], "L’Aquila Rugby": ["#0f766e", "#2dd4bf"], "CUS Catania": ["#ef2b2b", "#ff6b6b"], "Rugby Gubbio": ["#1d3f8f", "#7ba0e8"], "Lazio Rugby 1927": ["#a07f3a", "#d4b06a"], "Paganica Rugby": ["#1c1917", "#e7e5e4"], "Primavera Rugby": ["#d4a900", "#ffd60a"], "RNA": ["#2ea44f", "#4ade80"], "FifaSecurity San Benedetto": ["#d6336c", "#ff8fb3"], "Roma Olimpic": ["#166534", "#86efac"], "US Roma Rugby": ["#1d5fb4", "#5aa0f0"],"Amatori&Union Milano": ["#b89b00", "#f2d21b"], "Modena Rugby": ["#0b7a3a", "#4ade80"], "Brixia": ["#123c69", "#7fb0e6"], "Rugby Lecco": ["#0284c7", "#38bdf8"], "Italian Floor Bergamo": ["#be123c", "#fb7185"], "Unione Monferrato": ["#991b1b", "#fca5a5"], "Rugby Milano": ["#c0504d", "#e8837f"], "CUS Genova": ["#e11d1d", "#ff6b6b"], "CUS Milano": ["#e08e0b", "#f5a623"], "Rugby Viadana": ["#27272a", "#fde047"], "Rugby Rovato": ["#4f46e5", "#a5b4fc"], "Stade Valdôtain": ["#a16207", "#eab308"],"Livorno Rugby":["#16a34a","#4ade80"],"Isweb Avezzano":["#8b5a2b","#c8935a"],"Rugby Calvisano":["#c99a00","#f5c518"],"Piacenza Rugby":["#dc2626","#f87171"],"Unione Rugby Capitolina":["#7a2e6d","#c47bb8"],"CUS Torino":["#1e3a8a","#7b93e0"],"Pesaro Rugby":["#ea580c","#fb923c"],"Rugby Cavalieri":["#00a8e8","#38bdf8"],"Rugby Parma":["#4338ca","#9a96f5"],"Amatori Rugby Alghero":["#1f2937","#e5e7eb"],"Valsugana Junior Padova":["#2f6fb3","#5ea3e6"],"VII Rugby Torino":["#be123c","#fb7185"] const dk=()=>{const t=document.documentElement.dataset.theme;return t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches)};
const tc=n=>COL[n]?COL[n][dk()?1:0]:null;
const nm=n=>{const c=tc(n);return c?`<span style="color:${c};font-weight:600">${n}</span>`:n};
function stand(g,r){
 const m={};T.filter(t=>t.g===g).forEach(t=>m[t.n]={n:t.n,pt:0,g:0,v:0,pa:0,p:0,me:0,pf:0,ps:0,pen:0});
 for(let i=0;i<=r;i++)(rounds[i]||[]).filter(x=>gOf(x.h)===g).forEach(x=>{
  [[x.h,x.hs,x.as,x.ht],[x.a,x.as,x.hs,x.at]].forEach(([n,f,s,tr])=>{
   const o=m[n];o.g++;o.pf+=f;o.ps+=s;o.me+=tr;
   if(f>s){o.v++;o.pt+=4}else if(f===s){o.pa++;o.pt+=2}else{o.p++;if(s-f<=7)o.pt++}
   if(tr>=4)o.pt++})});
 PEN.forEach(p=>{if(m[p.t]&&p.r<=r){m[p.t].pt+=p.p;m[p.t].pen+=p.p}});
 const a=Object.values(m).sort((x,y)=>y.pt-x.pt||(y.pf-y.ps)-(x.pf-x.ps)||y.pf-x.pf||x.n.localeCompare(y.n));
 a.forEach((o,i)=>o.pos=i+1);return a}

function render(){
 const L=lastR(G);if(R>L)R=L;const rng=document.getElementById("rng");rng.max=L;rng.value=R;
 document.getElementById("gl").textContent="Giornata "+(R+1)+" di "+(L+1);
 document.getElementById("prev").disabled=R===0;document.getElementById("next").disabled=R>=L;
 document.getElementById("tabs").innerHTML=[1,2,3,4].map(g=>`<button class="${g===G?"on":""}" data-g="${g}">Girone ${g}</button>`).join("");
 const cur=stand(G,R),prev=R>0?stand(G,R-1):null;
 const pm=prev?Object.fromEntries(prev.map(o=>[o.n,o.pos])):{};
 let h=`<thead><tr><th>#</th><th></th><th class="t">Squadra</th><th>Pt</th><th>G</th><th>V</th><th>N</th><th>P</th><th>Mete</th><th>PF</th><th>PS</th><th>Diff</th><th>Pen</th></tr></thead><tbody>`;
 cur.forEach(o=>{
  let d="";if(prev){const k=pm[o.n]-o.pos;d=k>0?`<span class="up">▲${k}</span>`:k<0?`<span class="dn">▼${-k}</span>`:`<span class="eq">–</span>`}
  const df=o.pf-o.ps;
  h+=`<tr data-n="${o.n}" class="${o.n===SEL?"sel":""}${o.n===HOV?" hov":""}"><td>${o.pos}</td><td>${d}</td><td class="t">${bdg(o.n)}${nm(o.n)}</td><td class="pt">${o.pt}</td><td>${o.g}</td><td>${o.v}</td><td>${o.pa}</td><td>${o.p}</td><td>${o.me}</td><td>${o.pf}</td><td>${o.ps}</td><td>${df>0?"+":""}${df}</td><td>${o.pen||""}</td></tr>`});
 document.getElementById("tb").innerHTML=h+"</tbody>";
 const rs=(rounds[R]||[]).filter(x=>gOf(x.h)===G);
 document.getElementById("res").innerHTML=rs.map(x=>`<div>${bdg(x.h)}${nm(x.h)}</div><div class="s">${x.hs} – ${x.as}</div><div class="a">${bdg(x.a)}${nm(x.a)}</div>`).join("")||"Nessun risultato.";
 bump();
}
function bump(){
 const el=document.getElementById("bump");
 const NR=lastR(G)+1;if(NR<2){el.innerHTML='<div class="msg">Il grafico apparirà dalla seconda giornata, quando ci saranno posizioni da confrontare.</div>';return}
 const N=12,W=Math.max(560,NR*60+200),H=N*24+30,x=i=>40+i*((W-220)/Math.max(1,NR-1)),y=p=>20+(p-1)*24;
 const all=rounds.slice(0,NR).map((_,i)=>stand(G,i)),names=all[0].map(o=>o.n);
 let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;
 all.forEach((_,i)=>{s+=`<text x="${x(i)}" y="12" text-anchor="middle">G${i+1}</text>`});
 const act=HOV||SEL;[...names].sort((a,b)=>(a===act)-(b===act)).forEach(n=>{
  const pts=all.map((a,i)=>[x(i),y(a.find(o=>o.n===n).pos)]);
  const on=n===act,tcol=tc(n),c=tcol||(on?"var(--ac)":"var(--bd)"),op=act&&!on?(tcol?.3:.5):1;s+=`<g data-t="${n}" opacity="${op}" style="cursor:pointer">`;
  const pp=pts.map(p=>p.join(",")).join(" ");s+=`<polyline fill="none" stroke="transparent" stroke-width="12" points="${pp}"/><polyline fill="none" stroke="${c}" stroke-width="${on?3.5:(tcol?2:1.5)}" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
  pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${on?4:2.5}" fill="${c}"/>`});
  const last=pts[pts.length-1];
  s+=`<text x="${last[0]+8}" y="${last[1]+4}" style="${tcol?"fill:"+tcol+";font-weight:"+(on?800:600):on?"fill:var(--ac);font-weight:700":""}">${n}</text></g>`});

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-g]");if(b){G=+b.dataset.g;R=lastR(G);render();return}
 const r=e.target.closest("tr[data-n]");if(r){SEL=SEL===r.dataset.n?null:r.dataset.n;render()}});
document.getElementById("prev").onclick=()=>{R=Math.max(0,R-1);render()};
document.getElementById("next").onclick=()=>{R=Math.min(lastR(G),R+1);render()};
document.getElementById("rng").oninput=e=>{R=+e.target.value;render()};
let HOV=null;
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>render());
const setHov=n=>{if(HOV===n)return;HOV=n;bump();document.querySelectorAll("#tb tr[data-n]").forEach(r=>r.classList.toggle("hov",r.dataset.n===n))};
document.addEventListener("mouseover",e=>{const t=e.target.closest("#bump [data-t],#tb tr[data-n]");setHov(t?(t.dataset.t||t.dataset.n):null)});
render();
