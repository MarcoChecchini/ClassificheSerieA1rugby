name: Prova Giudice Sportivo
on:
  push:
    branches: [prova-giudice]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save pdfjs-dist@4
      - run: node scripts/giudice.mjs --dump > dump.txt; cat dump.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add dump.txt && git commit -m "dump" && git push
