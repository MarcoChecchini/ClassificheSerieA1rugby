name: Prova Giudice Sportivo
on:
  push:
    branches: [prova-giudice]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save pdfjs-dist@4
      - run: node scripts/giudice.mjs --dump > dump.txt; cat dump.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dump
          path: dump.txt
